name = "wizard-app-index"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [
  { pattern = "apps.aiwizards.com", custom_domain = true },
  # Public store page on the main site; only this path, everything else stays with aiwizards-frontend.
  # "wizard-apps*" also matches query strings (?utm=...) and sub-paths.
  { pattern = "www.aiwizards.com/wizard-apps*", zone_name = "aiwizards.com" },
  # One-line Wizard OS install: curl -fsSL https://aiwizards.com/os.sh | bash
  { pattern = "www.aiwizards.com/os.sh", zone_name = "aiwizards.com" },
  # One-time install approval (unadvertised): the owner's browser encrypts their server password to the box's key.
  { pattern = "www.aiwizards.com/os-approve*", zone_name = "aiwizards.com" },
  # Agent install instructions (unlisted: no homepage button; shared as one sentence). The apex 308s to www, like /os.sh.
  { pattern = "www.aiwizards.com/os.md", zone_name = "aiwizards.com" },
]

[[d1_databases]]
binding = "DB"
database_name = "wizard-app-index"
database_id = "2e92e8fd-b40d-4d4c-9fd5-0c5ff68f5e58"
migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
